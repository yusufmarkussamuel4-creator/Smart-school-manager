<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Management | Smart School Manager</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .teacher-container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 20px;
        }

        .teacher-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .teacher-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .teacher-form label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .teacher-form input,
        .teacher-form select,
        .teacher-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .teacher-button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #176b45;
            color: white;
            margin: 8px 5px 0 0;
        }

        .secondary-button {
            background: #555;
        }

        .archive-button {
            background: #b7791f;
        }

        .teacher-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .teacher-table th,
        .teacher-table td {
            padding: 11px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .teacher-table th {
            background: #f1f5f9;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .teacher-message {
            margin-top: 12px;
            font-weight: bold;
        }

        .teacher-search {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header class="dashboard-header">
    <h2>SMART SCHOOL MANAGER</h2>
    <p>Teacher Management</p>
</header>

<main class="teacher-container">

    <section class="teacher-card">
        <h3>Register Teacher</h3>

        <form id="teacherForm">

            <input type="hidden" id="teacherId">

            <div class="teacher-form">

                <div>
                    <label for="staffNumber">Staff Number *</label>
                    <input type="text" id="staffNumber" required>
                </div>

                <div>
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" required>
                </div>

                <div>
                    <label for="middleName">Middle Name</label>
                    <input type="text" id="middleName">
                </div>

                <div>
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" required>
                </div>

                <div>
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div>
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone">
                </div>

                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email">
                </div>

                <div>
                    <label for="qualification">Qualification</label>
                    <input type="text" id="qualification"
                           placeholder="e.g. B.Ed, B.Sc, NCE">
                </div>

                <div>
                    <label for="employmentDate">Employment Date</label>
                    <input type="date" id="employmentDate">
                </div>

                <div>
                    <label for="homeAddress">Home Address</label>
                    <textarea id="homeAddress" rows="2"></textarea>
                </div>

            </div>

            <button type="submit" class="teacher-button"
                    id="saveTeacherButton">
                Register Teacher
            </button>

            <button type="button"
                    class="teacher-button secondary-button"
                    id="cancelEditButton" hidden>
                Cancel Edit
            </button>

        </form>

        <p id="teacherMessage" class="teacher-message"></p>
    </section>

    <section class="teacher-card">

        <h3>Registered Teachers</h3>

        <input type="search" id="teacherSearch"
               class="teacher-search"
               placeholder="Search by name or staff number">

        <button type="button" class="teacher-button"
                id="showArchivedButton">
            View Archived Teachers
        </button>

        <div class="table-wrapper">

            <table class="teacher-table">
                <thead>
                    <tr>
                        <th>S/N</th>
                        <th>Staff Number</th>
                        <th>Teacher Name</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Qualification</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="teacherList">
                    <tr>
                        <td colspan="7">Loading teachers...</td>
                    </tr>
                </tbody>
            </table>

        </div>

        <p id="teacherSummary">Total Teachers: 0</p>

    </section>

    <p>
        <a href="admin.html">Back to Admin Dashboard</a>
    </p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="teachers.js"></script>

</body>
</html>

<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Settings | Smart School Manager</title>
<link rel="stylesheet" href="styles.css"><style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: #f1f5f3;
    color: #222;
    margin: 0;
}

.settings-container {
    max-width: 750px;
    margin: 25px auto;
    padding: 18px;
}

.settings-card {
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h1 {
    color: #176b43;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.logo-preview-container {
    text-align: center;
    margin: 20px 0;
}

#logoPreview {
    display: none;
    width: 150px;
    height: 150px;
    object-fit: contain;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px;
    margin: auto;
    background: white;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

#saveBtn {
    background: #176b43;
    color: white;
}

#saveBtn:disabled {
    opacity: .6;
}

#statusMessage {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #176b43;
    text-decoration: none;
}
</style></head><body><div class="settings-container">
<div class="settings-card"><h1>School Settings</h1>
<p class="subtitle">Manage your school's information and official logo.</p><label>School Name</label>
<input id="schoolName" type="text" readonly>

<label>Head Teacher / Principal's Name</label>
<input id="headTeacherName" type="text"
placeholder="Enter Head Teacher or Principal's Name">

<label>School Address</label>
<input id="schoolAddress" type="text">

<label>School Phone</label>
<input id="schoolPhone" type="tel">

<label>School Email</label>
<input id="schoolEmail" type="email">

<label>Upload School Logo</label>
<input id="logoFile" type="file" accept="image/*">

<div class="logo-preview-container">
<img id="logoPreview" alt="School Logo Preview">
</div><button id="saveBtn">Save School Settings</button>

<div id="statusMessage"></div><a class="back-link" href="report-card.html">← Back to Report Card</a>

</div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=1"></script><script src="school-settings.js?v=2"></script></body>
</html>

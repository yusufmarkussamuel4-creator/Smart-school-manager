<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>School Settings | Smart School Manager</title><link rel="stylesheet" href="styles.css"><style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f3;
    color: #222;
    margin: 0;
}

.settings-container {
    max-width: 750px;
    margin: 25px auto;
    padding: 18px;
}

.settings-card {
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h1 {
    color: #176b43;
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
    line-height: 1.5;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #176b43;
}

input[readonly] {
    background: #f2f2f2;
}

.logo-preview-container {
    text-align: center;
    margin: 20px 0;
}

#logoPreview {
    display: none;
    width: 150px;
    height: 150px;
    object-fit: contain;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px;
    margin: auto;
    background: white;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

#saveBtn {
    background: #176b43;
    color: white;
}

#saveBtn:hover {
    background: #105432;
}

#saveBtn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#statusMessage {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
    line-height: 1.5;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #176b43;
    text-decoration: none;
}

.back-link:hover {
    text-decoration: underline;
}

@media (max-width: 600px) {
    .settings-container {
        margin: 10px auto;
        padding: 12px;
    }

    .settings-card {
        padding: 18px;
    }
}
</style></head><body><div class="settings-container"><div class="settings-card"><h1>School Settings</h1><p class="subtitle">
Manage your school's profile, official details and branding.
</p><label for="schoolName">School Name</label>
<input
id="schoolName"
type="text"
readonly

«»

<label for="schoolMotto">School Motto</label>
<input
id="schoolMotto"
type="text"
placeholder="Enter your school's motto"

«»

<label for="headTeacherName">
Head Teacher / Principal's Name
</label><input
id="headTeacherName"
type="text"
placeholder="Enter Head Teacher or Principal's Name"

«»

<label for="schoolAddress">School Address</label>
<input
id="schoolAddress"
type="text"
placeholder="Enter school address"

«»

<label for="schoolPhone">School Phone</label>
<input
id="schoolPhone"
type="tel"
placeholder="Enter school phone number"

«»

<label for="schoolEmail">School Email</label>
<input
id="schoolEmail"
type="email"
placeholder="Enter school email address"

«»

<label for="logoFile">Upload School Logo</label>

<input
id="logoFile"
type="file"
accept="image/png,image/jpeg,image/webp"

«»

<div class="logo-preview-container"><img
id="logoPreview"
alt="School Logo Preview"

«»

</div><button id="saveBtn" type="button">
Save School Settings
</button><div
    id="statusMessage"
    role="status"
    aria-live="polite"
></div><a class="back-link" href="report-card.html">
← Back to Report Card
</a></div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=1"></script><script src="school-settings.js?v=3"></script></body>
</html>

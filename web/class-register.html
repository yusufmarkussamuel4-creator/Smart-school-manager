<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class Register | Smart School Manager</title>

<link rel="stylesheet" href="styles.css">

<style>
.register-container {
    max-width: 1100px;
    margin: 20px auto;
    padding: 15px;
}

.register-card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.register-card select,
.register-card input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.register-table {
    width: 100%;
    border-collapse: collapse;
}

.register-table th,
.register-table td {
    padding: 12px 8px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

.register-table th {
    background: #f0f3f7;
}

.register-table button {
    padding: 8px;
    cursor: pointer;
}

.register-button {
    padding: 12px 18px;
    background: #1769aa;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.register-summary {
    font-weight: bold;
    margin: 15px 0;
}

@media(max-width:600px) {
    .register-container {
        padding: 10px;
    }

    .register-card {
        padding: 12px;
    }

    .register-table th,
    .register-table td {
        font-size: 12px;
        padding: 7px 4px;
    }
}
</style>
</head>

<body>

<header class="dashboard-header">
    <h1>Class Register</h1>
    <p>Smart School Manager</p>
</header>

<main class="register-container">

    <section class="register-card">
        <h2>Select Class</h2>

        <label for="registerClass">Class and Arm</label>
        <select id="registerClass">
            <option value="">Loading classes...</option>
        </select>

        <label for="registerSession">Academic Session</label>
        <input
            type="text"
            id="registerSession"
            value="2026/2027"
        >

        <label for="registerTerm">Term</label>
        <select id="registerTerm">
            <option value="First Term">First Term</option>
            <option value="Second Term">Second Term</option>
            <option value="Third Term">Third Term</option>
        </select>

        <button
            type="button"
            class="register-button"
            id="loadRegisterButton"
        >
            Load Class Register
        </button>
    </section>

    <section class="register-card">

        <h2 id="registerTitle">Students in Class</h2>

        <div class="register-summary" id="registerSummary">
            Select a class to view its students.
        </div>

        <input
            type="search"
            id="registerSearch"
            placeholder="Search by admission number or student name..."
        >

        <div style="overflow-x:auto;">

            <table class="register-table">

                <thead>
                    <tr>
                        <th>S/N</th>
                        <th>Admission No.</th>
                        <th>Student Name</th>
                        <th>Gender</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="registerList">
                    <tr>
                        <td colspan="5">
                            Select a class to display students.
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </section>

    <section class="register-card">

        <h2>Transfer Student</h2>

        <form id="transferForm">

            <label for="transferStudent">Select Student</label>
            <select id="transferStudent" required>
                <option value="">Load a class register first</option>
            </select>

            <label for="transferClass">Destination Class</label>
            <select id="transferClass" required>
                <option value="">Select destination class</option>
            </select>

            <button type="submit" class="register-button">
                Transfer Student
            </button>

        </form>

        <p id="transferMessage"></p>

    </section>

    <button
        type="button"
        onclick="location.href='admin.html'"
        class="register-button"
    >
        Back to Dashboard
    </button>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="class-register.js"></script>

</body>
</html>

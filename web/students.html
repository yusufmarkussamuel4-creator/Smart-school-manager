<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management | Smart School Manager</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            margin: 0;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            color: #263238;
        }

        .header {
            background: #123b63;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        h2 {
            color: #123b63;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select, textarea {
            padding: 11px;
            border: 1px solid #ccd3da;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            min-height: 75px;
        }

        button {
            background: #123b63;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
        }

        button:hover {
            opacity: .9;
        }

        .secondary-btn {
            background: #64748b;
        }

        .message {
            margin-top: 12px;
            font-weight: bold;
        }

        .photo-preview {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 2px solid #ccd3da;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eaf0f6;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: white;
            max-width: 650px;
            margin: 30px auto;
            padding: 22px;
            border-radius: 10px;
        }

        @media(max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>SMART SCHOOL MANAGER</h1>
    <p>Student Management</p>
</header>

<main class="container">

    <!-- STUDENT REGISTRATION -->
    <section class="card">
        <h2>Register New Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Admission Number</label>
                    <input type="text" id="admissionNumber" required>
                </div>

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" required>
                </div>

                <div class="form-group">
                    <label>Middle Name</label>
                    <input type="text" id="middleName">
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dateOfBirth">
                </div>

                <div class="form-group">
                    <label>Guardian Name</label>
                    <input type="text" id="guardianName">
                </div>

                <div class="form-group">
                    <label>Guardian Phone</label>
                    <input type="tel" id="guardianPhone">
                </div>

                <div class="form-group">
                    <label>Class</label>
                    <select id="classId" required>
                        <option value="">Select Class</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Academic Session</label>
                    <input type="text" id="academicSession"
                           value="2026/2027" required>
                </div>

                <div class="form-group">
                    <label>Term</label>
                    <select id="term" required>
                        <option value="">Select Term</option>
                        <option value="First Term">First Term</option>
                        <option value="Second Term">Second Term</option>
                        <option value="Third Term">Third Term</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Home Address</label>
                    <textarea id="homeAddress"></textarea>
                </div>

                <div class="form-group">
                    <label>Student Passport Photograph</label>
                    <input type="file"
                           id="passportPhoto"
                           accept="image/jpeg,image/png,image/webp">
                    <small>Maximum file size: 2 MB. JPG, PNG or WEBP.</small>
                    <img id="passportPreview"
                         class="photo-preview"
                         alt="Passport preview">
                </div>

            </div>

            <button type="submit">Register Student</button>

            <p id="studentMessage" class="message"></p>

        </form>
    </section>


    <!-- REGISTERED STUDENTS -->
    <section class="card">
        <h2>Registered Students</h2>

        <input type="search"
               id="studentSearch"
               placeholder="Search by name or admission number">

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Admission No.</th>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentList">
                    <tr>
                        <td colspan="4">Loading students...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>


<!-- STUDENT PROFILE MODAL -->
<div id="profileModal" class="modal">

    <div class="modal-content">

        <h2 id="profileTitle">Student Profile</h2>

        <form id="profileForm">

            <input type="hidden" id="profileStudentId">
            <input type="hidden" id="profileEnrollmentId">

            <div class="form-grid">

                <div class="form-group">
                    <label>Admission Number</label>
                    <input type="text" id="profileAdmission" disabled>
                </div>

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="profileFirstName" required>
                </div>

                <div class="form-group">
                    <label>Middle Name</label>
                    <input type="text" id="profileMiddleName">
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="profileLastName" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select id="profileGender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="profileDOB">
                </div>

                <div class="form-group">
                    <label>Guardian Name</label>
                    <input type="text" id="profileGuardian">
                </div>

                <div class="form-group">
                    <label>Guardian Phone</label>
                    <input type="tel" id="profilePhone">
                </div>

                <div class="form-group">
                    <label>Class</label>
                    <select id="profileClass" required>
                        <option value="">Select Class</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Academic Session</label>
                    <input type="text" id="profileSession" required>
                </div>

                <div class="form-group">
                    <label>Term</label>
                    <select id="profileTerm" required>
                        <option value="">Select Term</option>
                        <option value="First Term">First Term</option>
                        <option value="Second Term">Second Term</option>
                        <option value="Third Term">Third Term</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Home Address</label>
                    <textarea id="profileAddress"></textarea>
                </div>

                <div class="form-group">
                    <label>Change Passport Photograph</label>
                    <input type="file"
                           id="profilePassportPhoto"
                           accept="image/jpeg,image/png,image/webp">

                    <small>Maximum file size: 2 MB. JPG, PNG or WEBP.</small>

                    <img id="profilePassportPreview"
                         class="photo-preview"
                         alt="Student passport preview">
                </div>

            </div>

            <p id="profileMessage" class="message"></p>

            <button type="button" id="editProfileButton">
                Edit Profile
            </button>

            <button type="submit" id="saveProfileButton" style="display:none">
                Save Changes
            </button>

            <button type="button"
                    id="cancelEditButton"
                    class="secondary-btn"
                    style="display:none">
                Cancel
            </button>

            <button type="button"
                    class="secondary-btn"
                    onclick="document.getElementById('profileModal').style.display='none'">
                Close
            </button>

        </form>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="students.js"></script>

</body>
</html>

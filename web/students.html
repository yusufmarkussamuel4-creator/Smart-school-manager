<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management | Smart School Manager</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            background: #f3f6fa;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1150px;
            margin: 25px auto;
            padding: 15px;
        }

        .header {
            background: #123b65;
            color: white;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.07);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .btn {
            padding: 11px 17px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            margin: 4px;
        }

        .primary {
            background: #1769aa;
        }

        .success {
            background: #16804a;
        }

        .warning {
            background: #e69500;
        }

        .danger {
            background: #b42318;
        }

        .secondary {
            background: #555;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eaf0f6;
        }

        #studentMessage,
        #profileMessage {
            font-weight: bold;
            margin-top: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.7);
            z-index: 9999;
            overflow-y: auto;
            padding: 15px;
        }

        .modal-content {
            background: white;
            max-width: 750px;
            margin: 25px auto;
            padding: 22px;
            border-radius: 10px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media(max-width:600px) {
            .container {
                padding: 10px;
            }

            .card {
                padding: 15px;
            }

            .modal-content {
                padding: 15px;
                margin: 5px auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>SMART SCHOOL MANAGER</h2>
        <h3>Student Management</h3>
        <p>Register, manage and view student records.</p>
    </div>

    <!-- REGISTRATION -->

    <div class="card">

        <h3>Register New Student</h3>

        <form id="studentForm">

            <div class="form-grid">

                <div>
                    <label>Admission Number</label>
                    <input type="text" id="admissionNumber" required>
                </div>

                <div>
                    <label>First Name</label>
                    <input type="text" id="firstName" required>
                </div>

                <div>
                    <label>Middle Name</label>
                    <input type="text" id="middleName">
                </div>

                <div>
                    <label>Last Name</label>
                    <input type="text" id="lastName" required>
                </div>

                <div>
                    <label>Gender</label>
                    <select id="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div>
                    <label>Date of Birth</label>
                    <input type="date" id="dateOfBirth">
                </div>

                <div>
                    <label>Parent/Guardian Name</label>
                    <input type="text" id="guardianName">
                </div>

                <div>
                    <label>Guardian Phone</label>
                    <input type="tel" id="guardianPhone">
                </div>

                <div>
                    <label>Class</label>
                    <select id="classId" required>
                        <option value="">Loading classes...</option>
                    </select>
                </div>

                <div>
                    <label>Academic Session</label>
                    <input
                        type="text"
                        id="academicSession"
                        placeholder="2026/2027"
                        required
                    >
                </div>

                <div>
                    <label>Term</label>
                    <select id="term" required>
                        <option value="">Select Term</option>
                        <option value="First Term">First Term</option>
                        <option value="Second Term">Second Term</option>
                        <option value="Third Term">Third Term</option>
                    </select>
                </div>

                <div>
                    <label>Home Address</label>
                    <textarea id="homeAddress"></textarea>
                </div>

            </div>

            <br>

            <button type="submit" class="btn primary">
                Register Student
            </button>

            <p id="studentMessage"></p>

        </form>

    </div>

    <!-- REGISTERED STUDENTS -->

    <div class="card">

        <h3>Registered Students</h3>

        <input
            type="search"
            id="studentSearch"
            placeholder="Search by name, admission number or class..."
        >

        <br><br>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Admission No.</th>
                        <th>Student Name</th>
                        <th>Gender</th>
                        <th>Class</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentList">

                    <tr>
                        <td colspan="5">Loading students...</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <button
        class="btn secondary"
        onclick="window.location.href='admin.html'"
    >
        Back to Dashboard
    </button>

</div>

<!-- STUDENT PROFILE MODAL -->

<div id="profileModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h3 id="profileTitle">Student Profile</h3>

            <button
                type="button"
                class="btn danger"
                onclick="closeProfile()"
            >
                Close
            </button>

        </div>

        <hr>

        <form id="profileForm">

            <input type="hidden" id="profileStudentId">
            <input type="hidden" id="profileEnrollmentId">

            <div class="form-grid">

                <div>
                    <label>Admission Number</label>
                    <input type="text" id="profileAdmission" required>
                </div>

                <div>
                    <label>First Name</label>
                    <input type="text" id="profileFirstName" required>
                </div>

                <div>
                    <label>Middle Name</label>
                    <input type="text" id="profileMiddleName">
                </div>

                <div>
                    <label>Last Name</label>
                    <input type="text" id="profileLastName" required>
                </div>

                <div>
                    <label>Gender</label>
                    <select id="profileGender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div>
                    <label>Date of Birth</label>
                    <input type="date" id="profileDOB">
                </div>

                <div>
                    <label>Parent/Guardian Name</label>
                    <input type="text" id="profileGuardian">
                </div>

                <div>
                    <label>Guardian Phone</label>
                    <input type="tel" id="profilePhone">
                </div>

                <div>
                    <label>Class</label>
                    <select id="profileClass">
                    </select>
                </div>

                <div>
                    <label>Academic Session</label>
                    <input type="text" id="profileSession">
                </div>

                <div>
                    <label>Term</label>
                    <select id="profileTerm">
                        <option value="First Term">First Term</option>
                        <option value="Second Term">Second Term</option>
                        <option value="Third Term">Third Term</option>
                    </select>
                </div>

                <div>
                    <label>Home Address</label>
                    <textarea id="profileAddress"></textarea>
                </div>

            </div>

            <p id="profileMessage"></p>

            <button
                type="button"
                id="editProfileButton"
                class="btn warning"
            >
                Edit Student
            </button>

            <button
                type="submit"
                id="saveProfileButton"
                class="btn primary"
                style="display:none;"
            >
                Save Changes
            </button>

            <button
                type="button"
                id="cancelEditButton"
                class="btn secondary"
                style="display:none;"
            >
                Cancel Editing
            </button>

        </form>

    </div>

</div>

<!-- SCRIPTS: LOAD AFTER ALL HTML ELEMENTS -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="students.js"></script>

</body>
</html>

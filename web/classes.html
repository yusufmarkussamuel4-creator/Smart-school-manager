<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Management | Smart School Manager</title>
<link rel="stylesheet" href="styles.css">

<style>
.class-container {
    max-width: 1000px;
    margin: 20px auto;
    padding: 15px;
}

.class-card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.class-form {
    display: grid;
    gap: 12px;
}

.class-form input,
.class-form button {
    width: 100%;
    padding: 14px;
    box-sizing: border-box;
    border-radius: 8px;
}

.class-form button {
    background: #1769aa;
    color: white;
    border: none;
    font-weight: bold;
}

.class-table {
    width: 100%;
    border-collapse: collapse;
}

.class-table th,
.class-table td {
    padding: 12px 8px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

.class-table th {
    background: #f0f3f7;
}

.class-table button {
    padding: 8px;
    margin: 3px;
}

.class-message {
    margin-top: 10px;
    font-weight: bold;
}

@media(max-width:600px) {
    .class-container {
        padding: 10px;
    }

    .class-card {
        padding: 15px;
    }

    .class-table th,
    .class-table td {
        font-size: 13px;
        padding: 8px 5px;
    }
}
</style>
</head>

<body>

<header class="dashboard-header">
    <h1>Class Management</h1>
    <p>Smart School Manager</p>
</header>

<main class="class-container">

    <!-- CREATE CLASS -->
    <section class="class-card">
        <h2 id="formTitle">Create Class</h2>

        <form id="classForm" class="class-form">

            <input type="hidden" id="classId">

            <label for="className">Class Name</label>
            <input
                type="text"
                id="className"
                placeholder="e.g. Primary 1"
                required
            >

            <label for="classArm">Arm (Optional)</label>
            <input
                type="text"
                id="classArm"
                placeholder="e.g. A, B, Blue"
            >

            <button type="submit" id="saveClassButton">
                Create Class
            </button>

            <button type="button" id="cancelEditButton" style="display:none;">
                Cancel Edit
            </button>

        </form>

        <p id="classMessage" class="class-message"></p>
    </section>

    <!-- CLASS LIST -->
    <section class="class-card">
        <h2>Registered Classes</h2>

        <input
            type="search"
            id="classSearch"
            placeholder="Search classes..."
            style="width:100%;padding:12px;margin-bottom:15px;box-sizing:border-box;"
        >

        <div style="overflow-x:auto;">
            <table class="class-table">
                <thead>
                    <tr>
                        <th>Class</th>
                        <th>Arm</th>
                        <th>Students</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="classList">
                    <tr>
                        <td colspan="4">Loading classes...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <button type="button" onclick="location.href='admin.html'">
        Back to Dashboard
    </button>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="classes.js"></script>

</body>
</html>
